name: CI · Rust Native and Real GPUI WASM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core · tests and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gpui-grid-core --all-targets
      - run: cargo check -p gpui-grid-core

  native-gpui:
    name: GPUI native component and desktop · macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gpui-grid -p gpui-grid-native

  wasm-gpui:
    name: GPUI WebPlatform · actual wasm32 build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpui-web-wasm32
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify web host contracts
        run: npm --prefix web test
      - name: Compile actual GPUI component for WebAssembly
        run: ./scripts/build-wasm.sh --release
      - name: Package real GPUI canvas host and wasm-bindgen files
        run: npm --prefix web run build
      - name: Verify generated package is a real WASM module
        run: |
          test -s web/dist/viewer/pkg/gpui_grid_web_bg.wasm
          test -s web/dist/viewer/pkg/gpui_grid_web.js
          file web/dist/viewer/pkg/gpui_grid_web_bg.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-grid-wasm-preview
          path: web/dist
          retention-days: 14

  browser-e2e:
    name: Genuine GPUI WASM · Chromium software GPU smoke
    runs-on: ubuntu-latest
    needs: wasm-gpui
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: gpui-grid-wasm-preview
          path: web/dist
      - name: Install browser test dependencies
        run: npm --prefix web install --no-audit --no-fund
      - name: Install Playwright Chromium and system libraries
        run: ./web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run actual GPUI canvas and click smoke test
        run: npm --prefix web run test:e2e
      - name: Preserve GPU logs, screenshots and traces on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-browser-smoke-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
